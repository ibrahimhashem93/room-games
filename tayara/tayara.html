<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1120">
<title>الطيارة | Vexolabs</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0b1120; --panel: #151d33; --panel2: #1c2742; --line: #2a3654;
  --text: #f1f5f9; --muted: #8b98b8;
  --accent: #f43f5e; --green: #22c55e; --gold: #fbbf24;
}
html { direction: rtl; }
body {
  font-family: 'Segoe UI', Tahoma, 'Noto Kufi Arabic', Arial, sans-serif;
  background: radial-gradient(900px 500px at 50% -5%, #1a2547 0%, var(--bg) 55%);
  color: var(--text); min-height: 100vh;
  display: flex; flex-direction: column; gap: 10px; padding: 12px;
  user-select: none; touch-action: manipulation;
}
.topbar { display: flex; align-items: center; justify-content: space-between; }
.brand { font-size: 20px; font-weight: 800; }
.brand small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
.balance {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 16px;
}
.coin {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fde68a, var(--gold) 65%);
  display: inline-flex; align-items: center; justify-content: center;
  color: #78350f; font-size: 12px; font-weight: 900;
  box-shadow: 0 2px 6px rgba(251,191,36,.4);
}
.stage {
  position: relative; height: 320px;
  background: linear-gradient(180deg, #101a36 0%, #0b1226 100%);
  border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
}
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; direction: ltr; }
.stage.crashed { animation: flash .5s ease; }
@keyframes flash { 0%,100% { border-color: var(--line); } 50% { border-color: var(--accent); box-shadow: 0 0 30px rgba(244,63,94,.5); } }
.multiplier {
  position: absolute; top: 34%; right: 0; left: 0; text-align: center;
  font-size: 58px; font-weight: 900; color: #fff; direction: ltr;
  text-shadow: 0 0 30px rgba(244,63,94,.55); transition: font-size .2s;
}
.multiplier.crashed { color: var(--accent); }
.multiplier.won { color: var(--green); text-shadow: 0 0 30px rgba(34,197,94,.55); }
.mult-sub { display: block; font-size: 13px; font-weight: 700; color: var(--muted); text-shadow: none; margin-top: 4px; }
.plane {
  position: absolute; width: 40px; height: 40px; left: 0; top: 0;
  font-size: 30px; display: flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 0 10px rgba(244,63,94,.8));
  will-change: transform; pointer-events: none; direction: ltr;
}
.plane.falling { transition: transform .9s ease-in, opacity .9s; opacity: 0; }
.badge {
  position: absolute; top: 12px; right: 12px;
  display: flex; align-items: center; gap: 6px;
  background: rgba(244,63,94,.15); border: 1px solid rgba(244,63,94,.5);
  color: #fda4af; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700;
}
.badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.history { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.hist {
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 11px; font-size: 12px; font-weight: 800; direction: ltr; white-space: nowrap; flex: none;
}
.hist.good { color: var(--green); border-color: rgba(34,197,94,.4); }
.hist.bad { color: #fb7185; border-color: rgba(244,63,94,.4); }
.hist.mid { color: var(--gold); border-color: rgba(251,191,36,.4); }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.bet-label { font-size: 12.5px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.bet-row { display: flex; align-items: center; gap: 10px; }
.bet-input {
  flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px; text-align: center; font-size: 22px; font-weight: 900; color: var(--text);
  direction: ltr; font-family: inherit; outline: none; min-width: 0;
}
.bet-input:focus { border-color: #6366f1; }
.stepper {
  width: 50px; height: 50px; flex: none; border-radius: 14px;
  border: 1px solid var(--line); background: var(--panel2); color: var(--text);
  font-size: 24px; font-weight: 800; font-family: inherit; cursor: pointer;
}
.stepper:active { transform: scale(.93); }
.stepper:disabled, .quick:disabled { opacity: .4; }
.quick-row { display: flex; gap: 7px; }
.quick {
  flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 0; text-align: center; font-size: 13px; font-weight: 800; color: var(--muted);
  font-family: inherit; cursor: pointer; direction: ltr;
}
.quick:active { transform: scale(.95); }
.action {
  border: none; border-radius: 16px; padding: 16px;
  font-size: 19px; font-weight: 900; font-family: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: transform .1s;
}
.action:active { transform: scale(.97); }
.action:disabled { opacity: .5; }
.action.start { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; box-shadow: 0 10px 30px rgba(99,102,241,.35); }
.action.cashout { background: linear-gradient(135deg, #4ade80, #16a34a); color: #052e16; box-shadow: 0 10px 30px rgba(34,197,94,.35); }
.action .amount { font-size: 13px; font-weight: 800; direction: ltr; opacity: .85; }
.note { text-align: center; color: var(--muted); font-size: 11px; line-height: 1.7; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">✈️ الطيارة<small>Vexolabs — عملات افتراضية</small></div>
  <div class="balance"><span class="coin">$</span><span id="balance">10,000</span></div>
</div>

<div class="stage" id="stage">
  <svg id="svg" viewBox="0 0 400 320" preserveAspectRatio="none">
    <g stroke="#1e2a4a" stroke-width="1">
      <line x1="0" y1="80" x2="400" y2="80"/><line x1="0" y1="160" x2="400" y2="160"/><line x1="0" y1="240" x2="400" y2="240"/>
      <line x1="100" y1="0" x2="100" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/><line x1="300" y1="0" x2="300" y2="320"/>
    </g>
    <path id="area" fill="rgba(244,63,94,.18)" d=""/>
    <path id="curve" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" d=""/>
  </svg>
  <div class="badge" id="badge"><span class="dot"></span><span id="badge-text">جاهز</span></div>
  <div class="multiplier" id="mult">1.00x<span class="mult-sub" id="mult-sub">ضع رهانك وابدأ الجولة</span></div>
  <div class="plane" id="plane" style="display:none">🛩️</div>
</div>

<div class="history" id="history"></div>

<div class="panel">
  <div class="bet-label"><span>مبلغ الرهان (عملات افتراضية)</span><span id="bet-hint">الحد الأدنى 10</span></div>
  <div class="bet-row">
    <button class="stepper" id="minus" type="button">−</button>
    <input class="bet-input" id="bet" type="number" inputmode="numeric" min="10" value="100">
    <button class="stepper" id="plus" type="button">+</button>
  </div>
  <div class="quick-row">
    <button class="quick" data-amt="50" type="button">50</button>
    <button class="quick" data-amt="100" type="button">100</button>
    <button class="quick" data-amt="250" type="button">250</button>
    <button class="quick" data-amt="500" type="button">500</button>
    <button class="quick" data-amt="all" type="button">الكل</button>
  </div>
  <button class="action start" id="action" type="button">ابدأ الجولة 🛩️</button>
</div>

<div class="note">عملات افتراضية للّعب فقط — لا أموال حقيقية ولا مشتريات.<br>النتائج عشوائية بنسبة عائد عادلة ومعلنة.</div>

<script>
(function () {
  'use strict';

  /* ════════════════════════════════════════════════════════════════
     ⚙️ إعداد العائد للاعب (RTP)
     نسبة العائد الافتراضية 0.97 (97%): يعني التطبيق يحتفظ بحوالي 3%.
     الاحتمالات: ‏P(التحطم عند m أو أعلى) = RTP / m
     مثال: عند RTP=0.97 → احتمال تجاوز 2x ≈ 48.5% و10x ≈ 9.7%
     عدّل هذا الرقم فقط (بين 0.80 و 0.99) وسيتبعه كل منطق اللعبة.
     ════════════════════════════════════════════════════════════════ */
  const RTP = 0.97;

  const GROWTH_K = 0.14;    // سرعة صعود المضاعف (m = e^(K·t))
  const START_BALANCE = 10000;
  const MIN_BET = 10;

  const $ = function (s) { return document.querySelector(s); };
  const fmt = function (n) { return n.toLocaleString('en-US'); };

  let balance = START_BALANCE;
  let phase = 'idle';       // idle | flying | crashed | cashed
  let bet = 0;
  let crashPoint = 1;
  let multiplier = 1;
  let startTime = 0;
  let rafId = null;
  let history = [];

  const stage = $('#stage'), curve = $('#curve'), area = $('#area'),
        plane = $('#plane'), multEl = $('#mult'), subEl = $('#mult-sub'),
        badgeText = $('#badge-text'), actionBtn = $('#action'),
        betInput = $('#bet'), balanceEl = $('#balance'), historyEl = $('#history');

  function setBalance(v) { balance = v; balanceEl.textContent = fmt(balance); }

  function getBet() {
    const v = Math.floor(Number(betInput.value));
    return isNaN(v) ? 0 : v;
  }

  function renderAction() {
    if (phase === 'idle') {
      const b = getBet();
      actionBtn.className = 'action start';
      if (balance < MIN_BET) {
        actionBtn.innerHTML = 'شحن مجاني 🎁';
        actionBtn.disabled = false;
      } else {
        actionBtn.innerHTML = 'ابدأ الجولة 🛩️';
        actionBtn.disabled = !(b >= MIN_BET && b <= balance);
      }
    } else if (phase === 'flying') {
      const win = Math.floor(bet * multiplier);
      actionBtn.className = 'action cashout';
      actionBtn.innerHTML = 'اسحب الآن<span class="amount">' + fmt(win) + ' 🪙 = ' + fmt(bet) + ' × ' + multiplier.toFixed(2) + '</span>';
      actionBtn.disabled = false;
    } else {
      actionBtn.className = 'action start';
      actionBtn.disabled = true;
    }
    const lockBet = phase !== 'idle';
    betInput.disabled = lockBet;
    $('#minus').disabled = lockBet; $('#plus').disabled = lockBet;
    document.querySelectorAll('.quick').forEach(function (q) { q.disabled = lockBet; });
  }

  function setMult(m, cls, sub) {
    multiplier = m;
    multEl.firstChild.nodeValue = m.toFixed(2) + 'x';
    multEl.className = 'multiplier' + (cls ? ' ' + cls : '');
    if (sub !== undefined) subEl.textContent = sub;
  }

  function addHistory(m, cashed) {
    history.unshift(m);
    if (history.length > 14) history.pop();
    historyEl.innerHTML = '';
    history.forEach(function (h) {
      const s = document.createElement('span');
      s.className = 'hist ' + (h >= 10 ? 'good' : h >= 2 ? 'mid' : 'bad');
      s.textContent = h.toFixed(2) + 'x';
      historyEl.appendChild(s);
    });
  }

  // نقطة التحطم من توزيع العائد: P(crash ≥ m) = RTP / m
  function drawCrashPoint() {
    const u = Math.random();
    let c = RTP / u;
    if (c < 1) c = 1;         // ~3% تحطم فوري عند RTP=0.97
    return Math.max(1, Math.floor(c * 100) / 100);
  }

  // المنحنى مع تكبير تلقائي: الزمن على x والمضاعف على y
  function drawCurve(t, m) {
    const W = 400, H = 320, pad = 26;
    const N = 50;
    const xScale = Math.min(55, (W - pad * 2) / Math.max(t, 0.001));
    const yScale = Math.min(110, (H - pad * 2) / Math.max(Math.log(m), 0.001));
    let d = '', da = '';
    for (let i = 0; i <= N; i++) {
      const ti = t * i / N;
      const mi = Math.exp(GROWTH_K * ti);
      const x = pad + ti * xScale;
      const y = H - pad - Math.log(mi) * yScale;
      d += (i === 0 ? 'M' : ' L') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    curve.setAttribute('d', d);
    area.setAttribute('d', d + ' L' + (pad + t * xScale).toFixed(1) + ' ' + (H - pad) + ' L' + pad + ' ' + (H - pad) + ' Z');
    // الطيارة عند رأس المنحنى
    const hx = pad + t * xScale, hy = H - pad - Math.log(m) * yScale;
    const angle = -Math.atan2(Math.log(Math.exp(GROWTH_K * t)) * yScale / Math.max(t * xScale, 1), 1) * 180 / Math.PI;
    plane.style.transform = 'translate(' + (hx - 20) + 'px,' + (hy - 20) + 'px) rotate(' + Math.max(-45, angle) + 'deg)';
    // الإطار الداخلي للـ svg بنسبة العرض الفعلية
    const rect = stage.getBoundingClientRect();
    plane.style.left = '0'; plane.style.top = '0';
    plane.style.transform = 'translate(' + (hx / W * rect.width - 20) + 'px,' + (hy / H * rect.height - 20) + 'px) rotate(' + Math.max(-45, angle) + 'deg)';
  }

  function tick(now) {
    if (phase !== 'flying') return;
    const t = (now - startTime) / 1000;
    const m = Math.exp(GROWTH_K * t);
    if (m >= crashPoint) { crash(); return; }
    setMult(m, null, '🛩️ تحلق الآن… اسحب قبل التحطم!');
    drawCurve(t, m);
    renderAction();
    rafId = requestAnimationFrame(tick);
  }

  function startRound() {
    if (balance < MIN_BET) {          // شحن مجاني — عملات افتراضية فقط
      setBalance(START_BALANCE);
      subEl.textContent = 'تم الشحن المجاني! ضع رهانك 🎁';
      renderAction();
      return;
    }
    bet = getBet();
    if (bet < MIN_BET || bet > balance) return;
    setBalance(balance - bet);
    crashPoint = drawCrashPoint();
    phase = 'flying';
    badgeText.textContent = 'جولة مباشرة';
    curve.setAttribute('d', ''); area.setAttribute('d', '');
    stage.classList.remove('crashed');
    plane.className = 'plane'; plane.style.display = 'flex';
    setMult(1, null, '🛩️ تحلق الآن… اسحب قبل التحطم!');
    renderAction();
    startTime = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function cashOut() {
    if (phase !== 'flying') return;
    phase = 'cashed';
    cancelAnimationFrame(rafId);
    const win = Math.floor(bet * multiplier);
    setBalance(balance + win);
    addHistory(multiplier, true);
    setMult(multiplier, 'won', '🎉 ربحت ' + fmt(win) + ' عملة!');
    badgeText.textContent = 'سحب ناجح';
    plane.style.display = 'none';
    setTimeout(backToIdle, 2600);
    renderAction();
  }

  function crash() {
    phase = 'crashed';
    cancelAnimationFrame(rafId);
    setMult(crashPoint, 'crashed', '💥 تحطمت عند ' + crashPoint.toFixed(2) + 'x');
    badgeText.textContent = 'تحطمت';
    stage.classList.add('crashed');
    addHistory(crashPoint, false);
    // سقوط الطيارة
    plane.classList.add('falling');
    plane.style.transform += ' translate(-60px, 220px) rotate(-120deg)';
    setTimeout(backToIdle, 2600);
    renderAction();
  }

  function backToIdle() {
    phase = 'idle';
    badgeText.textContent = 'جاهز';
    plane.style.display = 'none';
    subEl.textContent = 'ضع رهانك وابدأ الجولة';
    renderAction();
  }

  actionBtn.addEventListener('click', function () {
    if (phase === 'idle') startRound();
    else if (phase === 'flying') cashOut();
  });

  $('#minus').addEventListener('click', function () { betInput.value = Math.max(MIN_BET, getBet() - 50); renderAction(); });
  $('#plus').addEventListener('click', function () { betInput.value = getBet() + 50; renderAction(); });
  betInput.addEventListener('input', renderAction);
  document.querySelectorAll('.quick').forEach(function (q) {
    q.addEventListener('click', function () {
      betInput.value = q.dataset.amt === 'all' ? Math.max(MIN_BET, balance) : q.dataset.amt;
      renderAction();
    });
  });

  setBalance(START_BALANCE);
  renderAction();
})();
</script>
</body>
</html>
